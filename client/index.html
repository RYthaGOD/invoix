<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1" />
  <title>SolanaInvoice - B2B Invoicing & Payment Platform</title>
  <meta name="description"
    content="Professional B2B invoicing and payment platform on Solana. Multi-stablecoin support, payment links, templates, and customer management. Secure and transparent." />
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link
    href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700&family=Outfit:wght@400;500;600;700;800&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500;600&display=swap"
    rel="stylesheet">
  <script type="module">
    // Polyfill Buffer for Solana wallet adapter and web3.js
    import { Buffer } from 'buffer';
    window.Buffer = Buffer;
    globalThis.Buffer = Buffer;
  </script>
  <script>
    // Suppress Vite HMR WebSocket errors (localhost:undefined) - Replit/Vite development quirk
    window.addEventListener("unhandledrejection", function (event) {
      if (
        event.reason?.message?.includes("Failed to construct 'WebSocket'") &&
        event.reason?.message?.includes("localhost:undefined")
      ) {
        event.preventDefault();
        console.log("[Vite HMR] Suppressed harmless WebSocket connection error");
      }
    });
  </script>
</head>

<body>
  <div id="root"></div>
  <script type="module" src="/src/main.tsx"></script>
</body>

</html>
